<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lesson Changeover Timer</title>

    <style>
        /* Ensure the page fills the entire screen */
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Main container */
        #container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            background-color: white;
            color: black;
        }

        /* Countdown timer text */
        #timer {
            font-size: 6rem;
            font-weight: bold;
        }

        /* Late message */
        .late {
            background-color: red !important;
            color: white !important;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="timer">Loading…</div>
</div>

<script>
    /*
        ================================
        CONFIGURATION SECTION
        ================================
    */

    /*
        Define lesson changeover periods.
        Times are in 24-hour format.
        Each entry has:
        - start: "HH:MM"
        - end:   "HH:MM"
    */
    const changeovers = [
        { start: "09:45", end: "09:49" },
        { start: "10:45", end: "10:49" },
        { start: "14:10", end: "14:14" }
    ];

    /*
        ================================
        HELPER FUNCTIONS
        ================================
    */

    /*
        Converts "HH:MM" into a Date object for today
    */
    function timeStringToDate(timeStr) {
        const [hours, minutes] = timeStr.split(":").map(Number);
        const now = new Date();
        now.setHours(hours, minutes, 0, 0);
        return now;
    }

    /*
        Formats milliseconds into MM:SS
    */
    function formatTime(ms) {
        const totalSeconds = Math.max(0, Math.floor(ms / 1000));
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        return `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
    }

    /*
        ================================
        MAIN TIMER LOGIC
        ================================
    */

    function updateTimer() {
        const now = new Date();
        const container = document.getElementById("container");
        const timerEl = document.getElementById("timer");

        let activePeriod = null;

        /*
            Determine whether we are within any changeover window
        */
        for (const period of changeovers) {
            const startTime = timeStringToDate(period.start);
            const endTime = timeStringToDate(period.end);

            if (now >= startTime && now <= endTime) {
                activePeriod = { startTime, endTime };
                break;
            }
        }

        /*
            CASE 1: During changeover window
        */
        if (activePeriod) {
            const remaining = activePeriod.endTime - now;

            container.classList.remove("late");
            timerEl.textContent = formatTime(remaining);
            return;
        }

        /*
            CASE 2: Past the end of a changeover window
            (Late condition)
        */
        for (const period of changeovers) {
            const endTime = timeStringToDate(period.end);

            if (now > endTime && now - endTime <= 5 * 60 * 1000) {
                // Late window: up to 5 minutes after end time
                container.classList.add("late");
                timerEl.textContent = "You're late to class!";
                return;
            }
        }

        /*
            CASE 3: No active changeover
        */
        container.classList.remove("late");
        timerEl.textContent = "No changeover in progress";
    }

    /*
        Update once per second
    */
    setInterval(updateTimer, 1000);
    updateTimer();
</script>

</body>
</html>
